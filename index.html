<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gunman Contracts Stand-Alone</title>
    <meta name="description" content="The contracts begin September 10, 2026. Open the website for the live countdown in your local timezone.">
    <meta name="theme-color" content="#e6a52d">
    <link rel="canonical" href="https://theglonker.github.io/GunmanContractsCountdown/">
    <meta property="og:type" content="article">
    <meta property="og:site_name" content="Gunman Contracts">
    <meta property="og:title" content="Gunman Contracts Stand-Alone">
    <meta property="og:description" content="The contracts begin September 10, 2026. Open the website for the live countdown in your local timezone.">
    <meta property="og:url" content="https://theglonker.github.io/GunmanContractsCountdown/">
    <meta property="og:image" content="https://theglonker.github.io/GunmanContractsCountdown/bg.jpg">
    <meta property="og:image:secure_url" content="https://theglonker.github.io/GunmanContractsCountdown/bg.jpg">
    <meta property="og:image:type" content="image/jpeg">
    <meta property="og:image:alt" content="Gunman Contracts Stand-Alone">
    <meta name="twitter:card" content="summary_large_image">
    <meta name="twitter:title" content="Gunman Contracts Stand-Alone">
    <meta name="twitter:description" content="The contracts begin September 10, 2026. Open the website for the live countdown in your local timezone.">
    <meta name="twitter:image" content="https://theglonker.github.io/GunmanContractsCountdown/bg.jpg">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        :root {
            --background: #061015;
            --accent: #e6a52d;
            --accent-light: #f3bd51;
            --text: #e8e2d7;
            --text-muted: #a8bbc2;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        html {
            min-height: 100%;
            background: var(--background);
        }

        body {
            min-height: 100vh;
            color: var(--text);
            font-family: "Barlow Condensed", sans-serif;
            background:
                linear-gradient(90deg, rgba(3, 10, 14, 0.84), rgba(3, 10, 14, 0.46) 50%, rgba(3, 10, 14, 0.78)),
                linear-gradient(0deg, rgba(3, 10, 14, 0.74), transparent 48%, rgba(3, 10, 14, 0.38)),
                url("bg.jpg") center / cover no-repeat fixed;
            overflow-x: hidden;
        }

        main {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: clamp(32px, 5vh, 64px) 24px;
        }

        .launch {
            width: min(1180px, 100%);
            text-align: center;
        }

        .eyebrow {
            margin-bottom: 10px;
            color: var(--accent);
            font-size: 0.9rem;
            font-weight: 700;
            letter-spacing: 0.38em;
            text-transform: uppercase;
        }

        h1 {
            max-width: 850px;
            margin: 0 auto;
            font-size: clamp(3.6rem, 6.5vw, 6.4rem);
            font-weight: 800;
            line-height: 0.89;
            letter-spacing: 0.015em;
            text-transform: uppercase;
        }

        h1 span {
            display: block;
            margin-top: 9px;
            color: var(--accent);
        }

        .divider {
            width: 90px;
            height: 3px;
            margin: 32px auto 30px;
            background: var(--accent);
        }

        .content-grid {
            display: grid;
            grid-template-columns: minmax(0, 1.15fr) minmax(360px, 0.85fr);
            align-items: center;
            gap: clamp(42px, 6vw, 84px);
        }

        .countdown-panel,
        .trailer-panel {
            min-width: 0;
        }

        .countdown-label,
        .trailer-title {
            margin-bottom: 14px;
            color: var(--text-muted);
            font-size: 0.95rem;
            font-weight: 600;
            letter-spacing: 0.28em;
            text-transform: uppercase;
        }

        .trailer-title {
            color: var(--accent);
        }

        .countdown {
            display: grid;
            grid-template-columns: repeat(4, minmax(0, 1fr));
            gap: clamp(8px, 1.4vw, 20px);
            width: 100%;
            font-variant-numeric: tabular-nums;
        }

        .time {
            min-width: 0;
            text-align: center;
        }

        .time-value {
            display: block;
            font-size: clamp(3.4rem, 6vw, 5.8rem);
            font-weight: 700;
            line-height: 0.92;
        }

        .time-label {
            display: block;
            margin-top: 9px;
            color: var(--accent);
            font-size: 0.92rem;
            font-weight: 700;
            letter-spacing: 0.12em;
            text-transform: uppercase;
        }

        .actions {
            margin-top: 34px;
        }

        .steam-link {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            min-width: 210px;
            padding: 15px 30px;
            border: 2px solid var(--accent);
            color: var(--background);
            background: var(--accent);
            font-size: 1.05rem;
            font-weight: 700;
            letter-spacing: 0.13em;
            text-decoration: none;
            text-transform: uppercase;
            transition: color 160ms ease, background-color 160ms ease, transform 160ms ease;
        }

        .steam-link:hover,
        .steam-link:focus-visible {
            color: var(--accent-light);
            background: rgba(6, 16, 21, 0.92);
            transform: translateY(-2px);
        }

        .steam-link:focus-visible {
            outline: 2px solid var(--text);
            outline-offset: 4px;
        }

        .launch-date {
            max-width: 520px;
            margin: 16px auto 0;
            color: var(--text-muted);
            font-size: 0.88rem;
            font-weight: 500;
            line-height: 1.4;
            letter-spacing: 0.12em;
            text-transform: uppercase;
        }

        .video-window {
            position: relative;
            width: 100%;
            aspect-ratio: 16 / 9;
            overflow: hidden;
            border: 2px solid rgba(230, 165, 45, 0.72);
            background: #000;
            box-shadow: 0 18px 45px rgba(0, 0, 0, 0.48);
        }

        .video-window iframe {
            position: absolute;
            inset: 0;
            width: 100%;
            height: 100%;
            border: 0;
        }

        .released {
            grid-column: 1 / -1;
            color: var(--accent);
            font-size: clamp(3.2rem, 7vw, 6rem);
            font-weight: 800;
            line-height: 1;
            text-transform: uppercase;
        }

        @media (max-width: 920px) {
            body {
                background-attachment: scroll;
                background-position: center top;
            }

            main {
                align-items: flex-start;
                padding: 34px 20px 52px;
            }

            .launch {
                width: min(700px, 100%);
            }

            h1 {
                font-size: clamp(3.2rem, 10vw, 5.6rem);
            }

            .content-grid {
                grid-template-columns: 1fr;
                gap: 42px;
            }

            .trailer-panel {
                width: min(620px, 100%);
                margin: 0 auto;
            }
        }

        @media (max-width: 620px) {
            main {
                min-height: 100svh;
                padding: 26px 14px 40px;
            }

            .eyebrow {
                font-size: 0.74rem;
                letter-spacing: 0.28em;
            }

            h1 {
                font-size: clamp(2.55rem, 13vw, 4.1rem);
                line-height: 0.92;
            }

            h1 span {
                margin-top: 6px;
            }

            .divider {
                width: 64px;
                height: 2px;
                margin: 22px auto 24px;
            }

            .content-grid {
                gap: 30px;
            }

            .countdown-label,
            .trailer-title {
                margin-bottom: 11px;
                font-size: 0.78rem;
                letter-spacing: 0.2em;
            }

            .countdown {
                grid-template-columns: repeat(2, minmax(0, 1fr));
                gap: 10px;
            }

            .time {
                padding: 12px 6px 10px;
                border-bottom: 1px solid rgba(230, 165, 45, 0.3);
                background: rgba(3, 10, 14, 0.36);
            }

            .time-value {
                font-size: clamp(2.8rem, 15vw, 4rem);
            }

            .time-label {
                margin-top: 6px;
                font-size: 0.78rem;
            }

            .actions {
                margin-top: 25px;
            }

            .steam-link {
                width: min(280px, 100%);
                min-width: 0;
                padding: 14px 20px;
            }

            .launch-date {
                max-width: 340px;
                margin-top: 13px;
                font-size: 0.76rem;
                line-height: 1.45;
                letter-spacing: 0.08em;
            }

            .video-window {
                border-width: 1px;
                box-shadow: 0 12px 30px rgba(0, 0, 0, 0.4);
            }
        }

        @media (max-width: 370px) {
            h1 {
                font-size: 2.35rem;
            }

            .time-value {
                font-size: 2.65rem;
            }
        }

        @media (prefers-reduced-motion: reduce) {
            .steam-link {
                transition: none;
            }
        }
    </style>
</head>
<body>
    <main>
        <section class="launch" aria-labelledby="launch-title">
            <p class="eyebrow">The Contracts Begin</p>
            <h1 id="launch-title">Gunman Contracts<span>Stand-Alone</span></h1>
            <div class="divider" aria-hidden="true"></div>

            <div class="content-grid">
                <div class="countdown-panel">
                    <p class="countdown-label">Launching In</p>
                    <div class="countdown" id="countdown" role="timer" aria-live="polite" aria-label="Time remaining until launch">
                        <div class="time"><span class="time-value" id="days">00</span><span class="time-label">Days</span></div>
                        <div class="time"><span class="time-value" id="hours">00</span><span class="time-label">Hours</span></div>
                        <div class="time"><span class="time-value" id="minutes">00</span><span class="time-label">Minutes</span></div>
                        <div class="time"><span class="time-value" id="seconds">00</span><span class="time-label">Seconds</span></div>
                    </div>
                    <div class="actions">
                        <a class="steam-link" href="https://store.steampowered.com/app/2421750/Gunman_Contracts__Stand_Alone/" target="_blank" rel="noopener noreferrer">View on Steam</a>
                        <p class="launch-date" id="launch-date"></p>
                    </div>
                </div>

                <div class="trailer-panel">
                    <p class="trailer-title">Watch The Launch Trailer</p>
                    <div class="video-window">
                        <iframe
                            src="https://www.youtube-nocookie.com/embed/iEEqBejCvqo?rel=0"
                            title="Gunman Contracts Stand-Alone launch trailer"
                            loading="lazy"
                            allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share"
                            referrerpolicy="strict-origin-when-cross-origin"
                            allowfullscreen>
                        </iframe>
                    </div>
                </div>
            </div>
        </section>
    </main>

    <script>
        const launchTime = Date.parse("2026-09-10T19:00:00+02:00");
        const countdownElement = document.getElementById("countdown");
        const daysElement = document.getElementById("days");
        const hoursElement = document.getElementById("hours");
        const minutesElement = document.getElementById("minutes");
        const secondsElement = document.getElementById("seconds");
        const launchDateElement = document.getElementById("launch-date");
        const formatTime = value => String(value).padStart(2, "0");
        let countdownInterval;

        function showLocalLaunchTime() {
            const launchDate = new Date(launchTime);
            const viewerTimeZone = Intl.DateTimeFormat().resolvedOptions().timeZone;
            const localDate = new Intl.DateTimeFormat(undefined, {
                weekday: "long",
                year: "numeric",
                month: "long",
                day: "numeric",
                hour: "2-digit",
                minute: "2-digit",
                timeZoneName: "short"
            }).format(launchDate);

            launchDateElement.textContent = `${localDate} · ${viewerTimeZone}`;
        }

        function updateCountdown() {
            const remainingTime = launchTime - Date.now();

            if (remainingTime <= 0) {
                countdownElement.innerHTML = '<p class="released">Available Now</p>';
                clearInterval(countdownInterval);
                return;
            }

            const totalSeconds = Math.floor(remainingTime / 1000);
            daysElement.textContent = formatTime(Math.floor(totalSeconds / 86400));
            hoursElement.textContent = formatTime(Math.floor((totalSeconds % 86400) / 3600));
            minutesElement.textContent = formatTime(Math.floor((totalSeconds % 3600) / 60));
            secondsElement.textContent = formatTime(totalSeconds % 60);
        }

        showLocalLaunchTime();
        updateCountdown();
        countdownInterval = setInterval(updateCountdown, 1000);
    </script>
</body>
</html>
